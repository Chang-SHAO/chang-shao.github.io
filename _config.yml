keywords: Chang SHAO, UTS, University of Technology Sydney
canonical: https://chang-shao.github.io # site root, no trailing slash
description: Chang SHAO completed his Ph.D. at University of Technology Sydney (UTS) working on computational intelligence, swarm intelligence, and machine learning.

